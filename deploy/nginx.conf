# 裸机/云服务器部署参考（不用 docker 时）：
#   web: cd web && npm run build  ->  dist/ 由 nginx 直出
#   api: cd server && pm2 start ecosystem.config.js  (8080)
upstream zhuomeng_api {
    server 127.0.0.1:8080;
    keepalive 32;
}
server {
    listen 80;
    server_name office.zhuomeng-tech.com;   # 改成实际域名
    root /var/www/zhuomeng-web/dist;        # web 构建产物路径
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location ~* \.(js|css|png|jpe?g|svg|ico|woff2?|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
    location /api/ {
        proxy_pass http://zhuomeng_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
    add_header X-Content-Type-Options nosniff;
    # add_header Strict-Transport-Security "max-age=31536000" always;  # 启用 HTTPS 后打开
}
